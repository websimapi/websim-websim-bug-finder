<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Websim Bug Finder</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
</head>
<body class="light-mode">
    <div class="theme-toggle">
        <button id="themeToggle" title="Toggle Dark/Light Mode">
            <i class="fas fa-moon"></i>
        </button>
    </div>
    <div class="container">
        <div class="sidebar">
            <div class="app-header">
                <div class="logo">
                    <i class="fas fa-bug"></i>
                    <h1>Websim Bug Finder</h1>
                </div>
                <p class="app-tagline">Find and fix issues in your Websim projects</p>
            </div>
            
            <div class="controls panel">
                <h2><i class="fas fa-tools"></i> Controls</h2>
                <div class="url-input">
                    <label for="websiteUrl">Website URL:</label>
                    <div class="input-group">
                        <input type="text" id="websiteUrl" value="https://websim.ai" placeholder="Enter URL">
                        <button id="loadButton" class="primary-btn" title="Load Website">
                            <i class="fas fa-globe"></i> Load
                        </button>
                    </div>
                    <div class="indicator" id="loadingIndicator">
                        <span class="status-dot"></span>
                        <span class="status-text">Ready</span>
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button id="extractButton" class="action-btn" title="Extract Code">
                        <i class="fas fa-code"></i> Extract Code
                    </button>
                    <button id="analyzeButton" class="action-btn" title="Analyze Code">
                        <i class="fas fa-search"></i> Analyze Code
                    </button>
                    <button id="analyzeLogs" class="action-btn" title="Analyze Console Logs">
                        <i class="fas fa-terminal"></i> Analyze Logs
                    </button>
                </div>
            </div>
            
            <div class="tabs-container">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="analysis">
                        <i class="fas fa-chart-line"></i> Analysis
                    </button>
                    <button class="tab-btn" data-tab="code">
                        <i class="fas fa-code"></i> Code
                    </button>
                    <button class="tab-btn" data-tab="logs">
                        <i class="fas fa-list"></i> Logs
                    </button>
                </div>
                
                <div class="tab-content">
                    <div class="tab-pane active" id="analysis-tab">
                        <div class="results-container panel">
                            <div class="panel-header">
                                <h2><i class="fas fa-chart-bar"></i> Analysis Results</h2>
                                <div class="panel-actions">
                                    <button class="icon-btn" id="copyAnalysis" title="Copy to clipboard">
                                        <i class="fas fa-copy"></i>
                                    </button>
                                    <button class="icon-btn" id="clearAnalysis" title="Clear results">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </div>
                            </div>
                            <div id="analysisResults" class="results"></div>
                        </div>
                    </div>
                    
                    <div class="tab-pane" id="code-tab">
                        <div class="extracted-code-container panel">
                            <div class="panel-header">
                                <h2><i class="fas fa-code"></i> Extracted Code</h2>
                                <div class="panel-actions">
                                    <button class="icon-btn" id="copyCode" title="Copy to clipboard">
                                        <i class="fas fa-copy"></i>
                                    </button>
                                    <button class="icon-btn" id="clearCode" title="Clear code">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </div>
                            </div>
                            <div id="extractedCode" class="code-display"></div>
                        </div>
                    </div>
                    
                    <div class="tab-pane" id="logs-tab">
                        <div class="console-logs-container panel">
                            <div class="panel-header">
                                <h2><i class="fas fa-terminal"></i> Console Logs</h2>
                                <div class="panel-actions">
                                    <button class="icon-btn" id="copyLogs" title="Copy to clipboard">
                                        <i class="fas fa-copy"></i>
                                    </button>
                                    <button class="icon-btn" id="clearLogs" title="Clear logs">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </div>
                            </div>
                            <div id="consoleLogs" class="logs-display"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="history panel collapsed">
                <div class="panel-header collapsible">
                    <h2><i class="fas fa-history"></i> Recent Sites</h2>
                    <button class="collapse-btn">
                        <i class="fas fa-chevron-down"></i>
                    </button>
                </div>
                <div class="collapsible-content">
                    <ul id="historyList" class="history-list">
                        <li class="empty-list">No history yet</li>
                    </ul>
                </div>
            </div>
        </div>
        
        <div class="main-content">
            <div class="iframe-header">
                <div class="browser-controls">
                    <button id="refreshFrame" class="icon-btn" title="Refresh">
                        <i class="fas fa-redo-alt"></i>
                    </button>
                    <div class="url-display">
                        <i class="fas fa-lock"></i>
                        <span id="currentUrl">about:blank</span>
                    </div>
                </div>
            </div>
            <div class="iframe-container">
                <div id="loadingOverlay" class="loading-overlay">
                    <div class="spinner"></div>
                    <p>Loading website...</p>
                </div>
                <iframe id="websiteFrame" src="about:blank"></iframe>
            </div>
        </div>
    </div>
    
    <div id="toast" class="toast">
        <div class="toast-icon">
            <i class="fas fa-info-circle"></i>
        </div>
        <div class="toast-content">
            <p id="toastMessage"></p>
        </div>
        <button id="toastClose" class="toast-close">
            <i class="fas fa-times"></i>
        </button>
    </div>
    
    <script src="script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
