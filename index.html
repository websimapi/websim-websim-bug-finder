<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Websim Bug Finder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Websim Bug Finder</h1>
            <div class="controls">
                <input type="text" id="websiteUrl" value="https://websim.ai" placeholder="Enter URL">
                <button id="loadButton">Load Website</button>
                <button id="extractButton">Extract Code</button>
                <button id="analyzeButton">Analyze Code</button>
                <button id="analyzeLogs">Analyze Console Logs</button>
            </div>
            <div class="results-container">
                <h2>Analysis Results</h2>
                <div id="analysisResults" class="results"></div>
            </div>
            <div class="extracted-code-container">
                <h2>Extracted Code</h2>
                <div id="extractedCode" class="code-display"></div>
            </div>
            <div class="console-logs-container">
                <h2>Console Logs</h2>
                <div id="consoleLogs" class="logs-display"></div>
            </div>
        </div>
        <div class="main-content">
            <div class="iframe-container">
                <iframe id="websiteFrame" src="about:blank"></iframe>
            </div>
        </div>
    </div>
    <script src="script.js"></script>

</body>
</html>
